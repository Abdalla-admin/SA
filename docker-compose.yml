version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: sa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sa_user
      POSTGRES_PASSWORD: sa_pass
      POSTGRES_DB: sun_aratinga
    ports:
      - '5433:5432'
    volumes:
      - sa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sa_user -d sun_aratinga']
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ./api
    container_name: sa_api
    restart: unless-stopped
    ports:
      - '3002:3001'
    environment:
      DATABASE_URL: postgresql://sa_user:sa_pass@postgres:5432/sun_aratinga
      JWT_SECRET: sun_aratinga_jwt_secret_2024
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules
    command: npm run dev
  frontend:
    build: ./frontend
    container_name: sa_frontend
    restart: unless-stopped
    ports:
      - '3003:3000'
    environment:
      VITE_API_URL: http://localhost:3002
    labels:
      - "dijitalview.client=true"
      - "dijitalview.name=Sun Aratinga"
      - "dijitalview.domain=https://sunaratinga.dijitalview.com"
      - "dijitalview.app_type=Solar Company"
      - "dijitalview.subscription=30"
      - "dijitalview.next_payment=2026-05-30"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
volumes:
  sa_pgdata:
